<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data: blob:; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Hẹn Nha · Thiệp mời hẹn hò</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <div class="floor"></div>
  <div class="sky" id="sky"></div>
  <div class="grain"></div>
</div>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <a class="brand" href="#/"><span class="brand-orb" aria-hidden="true"></span><span>Hẹn Nha</span></a>
  <nav class="top-nav" aria-label="Điều hướng chính">
    <button class="link hide-sm" type="button" data-scroll="how">Cách chơi</button>
    <a class="pill-link" href="#/q">Thiệp của tôi <b id="myCount">0</b></a>
    <a class="btn btn-sm hide-sm" href="#/create" data-new>Tạo thiệp</a>
  </nav>
</header>

<main id="app"></main>

<div class="fx-layer" id="fx" aria-hidden="true"><div class="burst-lottie" id="burstLottie"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============================ G0 · HOME ============================ -->
<template id="tpl-home">
<section class="hero wrap">
  <div class="hero-copy">
    <span class="chip-live"><i></i><span data-scramble>THIỆP MỜI HẸN HÒ · BẢN THỬ NGHIỆM</span></span>
    <h1 class="hero-title"><span class="split">Rủ crush đi chơi,</span> <span class="grad-line">nút Không tự bỏ chạy</span></h1>
    <p class="lead" data-reveal>Tạo một tấm thiệp trong một phút. Người ấy mở thư, bấm YES là nhận ngay vé hai người để khoe story.</p>
    <div class="hero-cta" data-reveal>
      <a class="btn btn-lg magnetic" href="#/create" data-new>Tạo thiệp – miễn phí <span aria-hidden="true">→</span></a>
      <a class="btn btn-ghost btn-lg magnetic" href="#/n/demo">Xem thiệp mẫu</a>
    </div>
  </div>
  <div class="hero-stage">
    <div class="orbit o1" aria-hidden="true"><div class="orbit-ring"><i class="p1"><span>🧋</span></i><i class="p2"><span>🎬</span></i></div></div>
    <div class="orbit o2" aria-hidden="true"><div class="orbit-ring"><i class="p1"><span>🎡</span></i><i class="p2"><span>🍲</span></i><i class="p3"><span>📸</span></i></div></div>
    <div class="stage-card glass glow-border tilt">
      <div class="lottie lt-fill" data-lottie="hearts" data-loop="1" data-fit="slice"></div>
      <span class="stage-eyebrow">Có thư cho cậu</span>
      <div class="love" id="heroLove"><svg class="bloom" id="heroBloom" viewBox="-20 -20 440 400" aria-hidden="true"></svg></div>
      <span class="stage-hint">Chạm trái tim để mở thử</span>
    </div>
    <div class="float-badge fb1" aria-hidden="true"><span>YES ✓</span></div>
    <div class="float-badge fb2" aria-hidden="true"><span>Không?? 🙈</span></div>
    <div class="float-badge fb3" aria-hidden="true"><span>🎫 Vé cho hai người</span></div>
  </div>
</section>

<section class="marquee" aria-label="Các kèo có sẵn">
  <div class="mq-row" id="mq1"></div>
  <div class="mq-row rev" id="mq2"></div>
</section>

<section class="section wrap">
  <div class="sec-head" data-reveal>
    <span class="eyebrow">Thử ngay</span>
    <h2>Bấm thử nút <span class="grad-text">Không</span> xem</h2>
    <p>Né chi cho mệt lòng nhau,<br>Trốn dăm ba bận trước sau cũng thành.</p>
  </div>
  <div class="demo glass glow-border" data-reveal>
    <div class="demo-stage" id="dQ">
      <p class="runaway" id="dRun" hidden>Nút Không xin nghỉ việc. YES tự bấm giúp rồi nhé!</p>
      <div class="card-deco" aria-hidden="true">
        <svg class="fl-defs" width="0" height="0" focusable="false">
          <defs>
            <g id="fl-leaf" fill="currentColor" fill-opacity=".5"><path d="M0 0C7-8 20-8 30 0C20 8 7 8 0 0Z"/></g>
            <g id="fl-flower" fill="currentColor" fill-opacity=".72">
              <path d="M0 0C-8-7-8-22 0-26C8-22 8-7 0 0Z"/>
              <path d="M0 0C-8-7-8-22 0-26C8-22 8-7 0 0Z" transform="rotate(72)"/>
              <path d="M0 0C-8-7-8-22 0-26C8-22 8-7 0 0Z" transform="rotate(144)"/>
              <path d="M0 0C-8-7-8-22 0-26C8-22 8-7 0 0Z" transform="rotate(216)"/>
              <path d="M0 0C-8-7-8-22 0-26C8-22 8-7 0 0Z" transform="rotate(288)"/>
              <circle r="4.5" fill="#fff1d6" fill-opacity=".85"/>
            </g>
            <g id="fl-branch">
              <path d="M2 2Q70 20 118 96M2 2Q20 70 36 128" fill="none" stroke="#a8d8c8" stroke-width="1.4" stroke-linecap="round" stroke-opacity=".45"/>
              <use href="#fl-leaf" transform="translate(35 15) rotate(-23)" color="#a8d8c8"/>
              <use href="#fl-leaf" transform="translate(35 15) rotate(77)" color="#a8d8c8"/>
              <use href="#fl-leaf" transform="translate(65 34) rotate(94)" color="#a8d8c8"/>
              <use href="#fl-leaf" transform="translate(93 62) rotate(-1)" color="#a8d8c8"/>
              <use href="#fl-leaf" transform="translate(19 67) rotate(129) scale(.8)" color="#a8d8c8"/>
              <use href="#fl-leaf" transform="translate(29 104) rotate(25) scale(.7)" color="#a8d8c8"/>
              <use href="#fl-flower" transform="translate(118 96) scale(.85)" color="#ffb8cc"/>
              <use href="#fl-flower" transform="translate(36 128) scale(.5)" color="#d4c1f5"/>
            </g>
          </defs>
        </svg>
        <i class="card-frame"></i>
        <span class="fl-corner c1"><svg class="fl-svg" viewBox="0 0 150 150"><use href="#fl-branch"/></svg></span>
        <span class="fl-corner c4"><svg class="fl-svg" viewBox="0 0 150 150"><use href="#fl-branch"/></svg></span>
      </div>
      <span class="eyebrow card-chip"><svg class="chip-fl" viewBox="-30 -30 60 60" aria-hidden="true"><use href="#fl-flower" color="#ffb8cc"/></svg> Thiệp mời từ Minh</span>
      <h3 class="q">Cậu ơi, cuối tuần này đi chơi với tớ nha?</h3>
      <div class="btns">
        <button class="btn btn-lg" id="dYes" type="button">YES</button>
        <button class="btn btn-ghost btn-lg" id="dNo" type="button">Không</button>
      </div>
    </div>
    <div class="demo-stage" id="dDone" hidden>
      <div class="stamp">Chốt kèo!</div>
      <p>Bấm YES xong, người ấy nhận ngay một tấm vé như bên dưới.</p>
      <div class="row-gap">
        <a class="btn btn-ghost btn-sm" href="#/n/demo">Xem trọn thiệp mẫu</a>
        <button class="link" id="dReplay" type="button">Chơi lại</button>
      </div>
    </div>
  </div>
</section>

<section class="section wrap" id="how">
  <div class="sec-head" data-reveal>
    <span class="eyebrow">Cách chơi</span>
    <h2>Bốn cảnh để tạo, <span class="grad-text">ba cảnh</span> để nhận lời</h2>
    <p>Không cần đăng nhập, không cần cài app. Gửi link qua Zalo hoặc Messenger là xong.</p>
  </div>
  <div class="seg" role="group" aria-label="Xem theo vai" data-reveal>
    <span class="seg-ind" aria-hidden="true"></span>
    <button class="seg-tab" type="button" aria-pressed="true" aria-controls="stepsSender" data-tab="sender">Bạn làm</button>
    <button class="seg-tab" type="button" aria-pressed="false" aria-controls="stepsReceiver" data-tab="receiver">Người ấy thấy</button>
  </div>
  <div class="steps four" id="stepsSender" data-reveal-stagger></div>
  <div class="steps three" id="stepsReceiver" hidden></div>
</section>

<section class="section wrap ticket-sec">
  <div class="ticket-copy" data-reveal>
    <span class="eyebrow">Cảnh kết</span>
    <h2>Một tấm vé, đủ để <span class="grad-text">khoe cả story</span></h2>
    <ul class="ticks">
      <li><span class="badge" aria-hidden="true">📸</span><div><b>Lưu ảnh khoe</b><span>Ảnh dọc 9:16, nhấn giữ là lưu, kể cả trong Zalo hay Messenger.</span></div></li>
      <li><span class="badge" aria-hidden="true">📅</span><div><b>Thêm vào lịch</b><span>Google Calendar hoặc Lịch iPhone, không cần email.</span></div></li>
      <li><span class="badge" aria-hidden="true">💌</span><div><b>Quản lý phản hồi</b><span>Xem ai đã nhận lời, ngày nào bị trùng lịch.</span></div></li>
    </ul>
  </div>
  <div class="ticket-host" id="homeTicket" data-reveal></div>
</section>

<section class="section wrap">
  <div class="cta-band glass glow-border" data-reveal>
    <div class="lottie cta-lottie" data-lottie="couple" data-loop="1"></div>
    <div>
      <h2>Sẵn sàng <span class="grad-text">rủ người ấy</span> chưa?</h2>
      <p>Thiệp đầu tiên miễn phí. Một phút là xong.</p>
    </div>
    <a class="btn btn-lg magnetic" href="#/create" data-new>Tạo thiệp ngay</a>
  </div>
</section>

<footer class="footer wrap">
  <nav><a href="#/" data-soon="Quyền riêng tư">Quyền riêng tư</a><a href="#/" data-soon="Điều khoản">Điều khoản</a><a href="#/" data-soon="Liên hệ">Liên hệ</a></nav>
  <p>© 2026 Hẹn Nha · bản demo, chưa phải bản chính thức</p>
</footer>
</template>

<!-- ============================ G1-G7 · CREATE ============================ -->
<template id="tpl-create">
<section class="create wrap">
  <div class="stepper" id="stepper"></div>
  <div class="create-grid">
    <div class="panel glass glow-border">

      <div class="cstep" data-step="1">
        <span class="eyebrow">Cảnh 1 · Nhân vật chính</span>
        <h2>Ai là nhân vật chính?</h2>
        <p class="sub">Tên hai bạn sẽ hiện ngay trên phong bì</p>
        <div class="field" id="fFrom">
          <label for="nameFrom">Tên bạn</label>
          <div class="input-wrap"><input id="nameFrom" type="text" maxlength="20" autocomplete="off" placeholder="Ví dụ: Minh" aria-required="true" aria-describedby="hFrom cFrom"><span class="count" id="cFrom">0/20</span></div>
          <p class="hint error" id="hFrom" aria-live="polite" hidden></p>
        </div>
        <div class="field" id="fTo">
          <label for="nameTo">Tên người ấy</label>
          <div class="input-wrap"><input id="nameTo" type="text" maxlength="20" autocomplete="off" placeholder="Ví dụ: Lan" aria-required="true" aria-describedby="hTo cTo"><span class="count" id="cTo">0/20</span></div>
          <p class="hint error" id="hTo" aria-live="polite" hidden></p>
        </div>
        <div class="nav"><a class="btn btn-ghost" href="#/">Trang chủ</a><button class="btn" id="next1" type="button" disabled>Tiếp</button></div>
      </div>

      <div class="cstep" data-step="2">
        <span class="eyebrow">Cảnh 2 · Lời thoại</span>
        <h2>Bạn muốn rủ thế nào?</h2>
        <p class="sub">Chọn một câu mẫu rồi sửa cho đúng giọng bạn</p>
        <div class="section-label">Câu mẫu</div>
        <div class="choices" id="templates"></div>
        <div class="field" id="fMsg">
          <label for="msg">Câu rủ của bạn</label>
          <div class="input-wrap"><textarea class="input" id="msg" maxlength="100" rows="3" aria-required="true" aria-describedby="hMsg cMsg"></textarea><span class="count bottom" id="cMsg">0/100</span></div>
          <p class="hint error" id="hMsg" aria-live="polite" hidden></p>
        </div>
        <div class="nav"><button class="btn btn-ghost" type="button" data-back>Quay lại</button><button class="btn" id="next2" type="button" disabled>Tiếp</button></div>
      </div>

      <div class="cstep" data-step="3">
        <span class="eyebrow">Cảnh 3 · Thời gian</span>
        <h2>Khi nào gặp nhau?</h2>
        <p class="sub">Ngày giờ chọn sẵn đợi người thương<br>Chỉ cần bấm YES kết uyên ương.</p>
        <div id="fixedPane">
          <div class="section-label">Ngày</div>
          <div id="cal"></div>
          <div class="time-row">
            <div><div class="section-label">Giờ</div><div id="hours"></div></div>
            <div><div class="section-label">Phút</div><div id="mins"></div></div>
          </div>
          <p class="when-line" id="when"></p>
        </div>
        <div class="nav"><button class="btn btn-ghost" type="button" data-back>Quay lại</button><button class="btn" id="next3" type="button" disabled>Tiếp</button></div>
      </div>

      <div class="cstep" data-step="4">
        <span class="eyebrow">Cảnh 4 · Kịch bản</span>
        <h2>Hẹn nhau đi đâu?</h2>
        <p class="sub">Chọn các kèo bạn muốn rủ, chúng sẽ hiện trên vé hai người</p>
        <div class="seg seg-plans" role="group" aria-label="Loại kèo">
          <button class="seg-tab" type="button" aria-pressed="true" aria-controls="planList" data-ptab="an">Ăn uống <span id="cntAn"></span></button>
          <button class="seg-tab" type="button" aria-pressed="false" aria-controls="planList" data-ptab="choi">Đi chơi <span id="cntChoi"></span></button>
        </div>
        <div class="opt-grid plan-scroll" id="planList"></div>
        <p class="counter" id="counter" aria-live="polite"></p>
        <div class="nav"><button class="btn btn-ghost" type="button" data-back>Quay lại</button><button class="btn" id="next4" type="button" disabled>Chiếu thử</button></div>
      </div>

      <div class="cstep" data-step="5">
        <span class="eyebrow">Chiếu thử</span>
        <h2>Xem người ấy sẽ thấy gì</h2>
        <p class="sub">Bấm thử như người ấy: mở thư, né nút Không, nhận vé</p>
        <div class="preview-phone"><span class="phone-notch"></span><div class="preview-host" id="previewHost"></div></div>
        <div class="center"><button class="link" id="replay" type="button">Xem lại từ đầu</button></div>
        <div class="nav"><button class="btn btn-ghost" id="editBtn" type="button">Sửa</button><button class="btn" id="next5" type="button">Tạo link</button></div>
      </div>

      <div class="cstep" data-step="6">
        <span class="eyebrow">Phát hành</span>
        <h2>Chọn vé phát hành</h2>
        <p class="sub">Thiệp đầu tiên của bạn được miễn phí</p>
        <div class="choices" id="pricing"></div>
        <div class="checks">
          <label class="check"><input type="checkbox" id="age"> <span>Tôi đủ 16 tuổi</span></label>
          <label class="check"><input type="checkbox" id="terms"> <span>Tôi đồng ý <a href="#/create" data-soon="Điều khoản">Điều khoản</a> và <a href="#/create" data-soon="Chính sách quyền riêng tư">Chính sách quyền riêng tư</a></span></label>
        </div>
        <p class="hint" id="hCreate">Tick cả hai ô phía trên để tạo link</p>
        <div class="nav"><button class="btn btn-ghost" type="button" data-back>Quay lại</button><button class="btn" id="createBtn" type="button" aria-describedby="hCreate" disabled>Tạo link</button></div>
      </div>

      <div class="cstep" data-step="7">
        <div class="launch">
          <span class="launch-emoji" aria-hidden="true">🎉</span>
          <span class="eyebrow">Công chiếu</span>
          <h2>Thiệp đã sẵn sàng!</h2>
          <p class="sub">Gửi link cho người ấy qua Zalo hoặc Messenger</p>
        </div>
        <div class="linkbox"><span id="link"></span><button class="btn btn-ghost btn-sm" id="copyLink" type="button">Copy</button></div>
        <div class="field" id="fShare">
          <label for="shareMsg">Lời nhắn gửi kèm</label>
          <div class="input-wrap"><textarea class="input" id="shareMsg" maxlength="100" rows="2" aria-describedby="hShare cShare">Tớ làm cái này cho cậu nè, mở xem đi</textarea><span class="count bottom" id="cShare"></span></div>
          <p class="hint" id="hShare" aria-live="polite"></p>
        </div>
        <button class="btn btn-block btn-lg" id="shareBtn" type="button">Chia sẻ</button>
        <div class="fb glass-inner" id="fb">
          <p>Bạn biết tới tụi mình từ đâu?</p>
          <div class="chip-row" id="fbOpts"></div>
        </div>
        <div class="nav"><a class="btn btn-ghost" href="#/q">Xem màn quản lý</a><button class="btn btn-ghost" id="newBtn" type="button">Tạo thiệp khác</button></div>
      </div>

    </div>
  </div>
</section>
</template>

<!-- ============================ N1-N6 · RECEIVER ============================ -->
<template id="tpl-n">
<section class="recv wrap">
  <div class="recv-card glass glow-border">
    <div class="recv-progress"><i id="rProg"></i></div>

    <div class="rstep active" data-step="1">
      <div class="lottie lt-fill" data-lottie="hearts" data-loop="1" data-fit="slice"></div>
      <span class="eyebrow" id="loveEyebrow">Có thư cho cậu</span>
      <div class="love" id="love">
        <svg class="bloom" id="bloom" viewBox="-20 -20 440 400" aria-hidden="true"></svg>
        <p class="love-hint" id="loveHint">Chạm vào trái tim để mở thư</p>
      </div>
      <div class="dash" id="dash" hidden>
        <span class="dash-skin" aria-hidden="true"></span>
        <div class="dash-top"><span class="dash-tag"><i></i>Event · Hẹn hò</span><span class="dash-code" id="dCode"></span></div>
        <h2 class="dash-title"><span id="dTo"></span> <i aria-hidden="true">×</i> <span id="dFrom"></span></h2>
        <p class="dash-msg" id="dMsg"></p>
        <div class="dash-stats">
          <div class="stat wide when"><small>Ngày</small><b id="dWhen"></b></div>
          <div class="stat wide"><small>Đếm ngược</small><b id="dLeft"></b></div>
        </div>
        <div class="dash-label">Lịch trình <span id="dCount"></span></div>
        <ol class="dash-tl" id="dPlans"></ol>
        <button class="btn btn-lg btn-block" id="dashGo" type="button">Trả lời lời mời</button>
      </div>
    </div>

    <div class="rstep" data-step="2">
      <span class="eyebrow">Đang chiếu</span>
      <div class="ask-emoji" aria-hidden="true">🥺</div>
      <h1 class="ask-title" id="askTitle"></h1>
      <p class="sub">Chỉ có một đáp án đúng thôi</p>
      <div class="ask-buttons" id="askButtons">
        <button class="btn btn-lg" id="yesBtn" type="button">YES</button>
        <button class="btn btn-ghost btn-lg" id="noBtn" type="button">Không</button>
      </div>
      <p class="runaway" id="runawayMsg" hidden>Nút Không xin nghỉ việc. YES tự bấm giúp rồi nhé!</p>
    </div>

    <div class="rstep" data-step="3">
      <div class="lottie end-lottie" data-lottie="holdHands" data-loop="1"></div>
      <span class="eyebrow">Cảnh kết</span>
      <h2>Chốt kèo rồi nha!</h2>
      <p class="sub" id="endSub"></p>
      <div class="ticket-host" id="rTicket"></div>
      <button class="btn btn-block btn-lg" id="saveBtn" type="button">Lưu ảnh khoe</button>
      <div class="end-actions">
        <button class="btn btn-ghost" id="calBtn" type="button">Thêm vào lịch</button>
        <button class="btn btn-ghost" id="mineBtn" type="button">Tạo thiệp của bạn</button>
      </div>
    </div>
  </div>
</section>
</template>

<!-- ============================ N7 · GONE ============================ -->
<template id="tpl-gone">
<section class="recv wrap">
  <div class="recv-card glass glow-border gone">
    <div class="big-emoji" aria-hidden="true">🫥</div>
    <span class="eyebrow">Hết suất chiếu</span>
    <h2>Lời mời này không còn nữa</h2>
    <p class="sub">Link có thể đã hết hạn, đã bị xóa hoặc bị sai.</p>
    <a class="btn btn-lg" href="#/" data-new>Tạo thiệp của bạn</a>
  </div>
</section>
</template>

<!-- ============================ Q · MANAGE ============================ -->
<template id="tpl-q">
<section class="manage wrap">
  <div class="q-head">
    <span class="eyebrow">Hậu trường</span>
    <h2>Thiệp của tôi</h2>
    <p class="sub">Thiệp được lưu trên trình duyệt này. Mở bằng trình duyệt khác sẽ không thấy.</p>
  </div>
  <div class="q-bar">
