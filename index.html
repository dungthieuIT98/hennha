<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data: blob:; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Hẹn Nha · Thiệp mời hẹn hò</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <div class="floor"></div>
  <div class="sky" id="sky"></div>
  <div class="grain"></div>
</div>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <a class="brand" href="#/"><span class="brand-orb" aria-hidden="true"></span><span>Hẹn Nha</span></a>
  <nav class="top-nav" data-i18n-attr="aria-label:nav.label">
    <button class="link hide-sm" type="button" data-scroll="how" data-i18n="nav.how"></button>
    <a class="pill-link" href="#/q"><span data-i18n="nav.mine"></span> <b id="myCount">0</b></a>
    <a class="btn btn-sm hide-sm" href="#/create" data-new data-i18n="nav.create"></a>
    <div class="lang-sw" role="group" data-i18n-attr="aria-label:lang.label">
      <button type="button" data-lang="vi" lang="vi" aria-label="Tiếng Việt" aria-pressed="false">VI</button>
      <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
    </div>
  </nav>
</header>

<main id="app"></main>

<div class="fx-layer" id="fx" aria-hidden="true"><div class="burst-lottie" id="burstLottie"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============================ G0 · HOME ============================ -->
<template id="tpl-home">
<section class="hero wrap">
  <div class="hero-copy">
    <span class="chip-live"><i></i><span data-scramble data-i18n="home.chip"></span></span>
    <h1 class="hero-title"><span class="split" data-i18n="home.h1a"></span> <span class="grad-line" data-i18n="home.h1b"></span></h1>
    <p class="lead" data-reveal data-i18n="home.lead"></p>
    <div class="hero-cta" data-reveal>
      <a class="btn btn-lg magnetic" href="#/create" data-new><span data-i18n="home.cta"></span> <span aria-hidden="true">→</span></a>
      <a class="btn btn-ghost btn-lg magnetic" href="#/n/demo" data-i18n="home.sample"></a>
    </div>
  </div>
  <div class="hero-stage">
    <div class="orbit o1" aria-hidden="true"><div class="orbit-ring"><i class="p1"><span>🧋</span></i><i class="p2"><span>🎬</span></i></div></div>
    <div class="orbit o2" aria-hidden="true"><div class="orbit-ring"><i class="p1"><span>🎡</span></i><i class="p2"><span>🍲</span></i><i class="p3"><span>📸</span></i></div></div>
    <div class="stage-card glass glow-border tilt">
      <div class="lottie lt-fill" data-lottie="hearts" data-loop="1" data-fit="slice"></div>
      <span class="stage-eyebrow" data-i18n="letter.for"></span>
      <div class="love" id="heroLove"><svg class="bloom" id="heroBloom" viewBox="-20 -20 440 400" aria-hidden="true"></svg></div>
      <span class="stage-hint" data-i18n="home.stageHint"></span>
    </div>
    <div class="float-badge fb1" aria-hidden="true"><span>YES ✓</span></div>
    <div class="float-badge fb2" aria-hidden="true"><span data-i18n="home.fbNo"></span></div>
    <div class="float-badge fb3" aria-hidden="true"><span data-i18n="home.fbTicket"></span></div>
  </div>
</section>

<section class="marquee" data-i18n-attr="aria-label:home.mq">
  <div class="mq-row" id="mq1"></div>
  <div class="mq-row rev" id="mq2"></div>
</section>

<section class="section wrap">
  <div class="sec-head" data-reveal>
    <span class="eyebrow" data-i18n="home.try"></span>
    <h2><span data-i18n="home.tryH2a"></span><span class="grad-text" data-i18n="home.tryH2b"></span><span data-i18n="home.tryH2c"></span></h2>
    <p data-i18n="home.tryPoem"></p>
  </div>
  <div class="demo glass glow-border" data-reveal>
    <div class="demo-stage" id="dQ">
      <p class="runaway" id="dRun" hidden data-i18n="ask.runaway"></p>
      <div class="card-deco" aria-hidden="true">
        <svg class="fl-defs" width="0" height="0" focusable="false">
          <defs>
            <g id="fl-leaf" fill="currentColor" fill-opacity=".5"><path d="M0 0C7-8 20-8 30 0C20 8 7 8 0 0Z"/></g>
            <g id="fl-flower" fill="currentColor" fill-opacity=".72">
              <path d="M0 0C-8-7-8-22 0-26C8-22 8-7 0 0Z"/>
              <path d="M0 0C-8-7-8-22 0-26C8-22 8-7 0 0Z" transform="rotate(72)"/>
              <path d="M0 0C-8-7-8-22 0-26C8-22 8-7 0 0Z" transform="rotate(144)"/>
              <path d="M0 0C-8-7-8-22 0-26C8-22 8-7 0 0Z" transform="rotate(216)"/>
              <path d="M0 0C-8-7-8-22 0-26C8-22 8-7 0 0Z" transform="rotate(288)"/>
              <circle r="4.5" fill="#fff1d6" fill-opacity=".85"/>
            </g>
            <g id="fl-branch">
              <path d="M2 2Q70 20 118 96M2 2Q20 70 36 128" fill="none" stroke="#a8d8c8" stroke-width="1.4" stroke-linecap="round" stroke-opacity=".45"/>
              <use href="#fl-leaf" transform="translate(35 15) rotate(-23)" color="#a8d8c8"/>
              <use href="#fl-leaf" transform="translate(35 15) rotate(77)" color="#a8d8c8"/>
              <use href="#fl-leaf" transform="translate(65 34) rotate(94)" color="#a8d8c8"/>
              <use href="#fl-leaf" transform="translate(93 62) rotate(-1)" color="#a8d8c8"/>
              <use href="#fl-leaf" transform="translate(19 67) rotate(129) scale(.8)" color="#a8d8c8"/>
              <use href="#fl-leaf" transform="translate(29 104) rotate(25) scale(.7)" color="#a8d8c8"/>
              <use href="#fl-flower" transform="translate(118 96) scale(.85)" color="#ffb8cc"/>
              <use href="#fl-flower" transform="translate(36 128) scale(.5)" color="#d4c1f5"/>
            </g>
          </defs>
        </svg>
        <i class="card-frame"></i>
        <span class="fl-corner c1"><svg class="fl-svg" viewBox="0 0 150 150"><use href="#fl-branch"/></svg></span>
        <span class="fl-corner c4"><svg class="fl-svg" viewBox="0 0 150 150"><use href="#fl-branch"/></svg></span>
      </div>
      <span class="eyebrow card-chip"><svg class="chip-fl" viewBox="-30 -30 60 60" aria-hidden="true"><use href="#fl-flower" color="#ffb8cc"/></svg> <span data-i18n="home.demoFrom"></span></span>
      <h3 class="q" data-i18n="home.demoQ"></h3>
      <div class="btns">
        <button class="btn btn-lg" id="dYes" type="button">YES</button>
        <button class="btn btn-ghost btn-lg" id="dNo" type="button" data-i18n="ask.no"></button>
      </div>
    </div>
    <div class="demo-stage" id="dDone" hidden>
      <div class="stamp" data-i18n="home.stamp"></div>
      <p data-i18n="home.demoDone"></p>
      <div class="row-gap">
        <a class="btn btn-ghost btn-sm" href="#/n/demo" data-i18n="home.fullSample"></a>
        <button class="link" id="dReplay" type="button" data-i18n="home.replay"></button>
      </div>
    </div>
  </div>
</section>

<section class="section wrap" id="how">
  <div class="sec-head" data-reveal>
    <span class="eyebrow" data-i18n="nav.how"></span>
    <h2><span data-i18n="home.howH2a"></span><span class="grad-text" data-i18n="home.howH2b"></span><span data-i18n="home.howH2c"></span></h2>
    <p data-i18n="home.howP"></p>
  </div>
  <div class="seg" role="group" data-i18n-attr="aria-label:home.role" data-reveal>
    <span class="seg-ind" aria-hidden="true"></span>
    <button class="seg-tab" type="button" aria-pressed="true" aria-controls="stepsSender" data-tab="sender" data-i18n="home.roleSender"></button>
    <button class="seg-tab" type="button" aria-pressed="false" aria-controls="stepsReceiver" data-tab="receiver" data-i18n="home.roleReceiver"></button>
  </div>
  <div class="steps four" id="stepsSender" data-reveal-stagger></div>
  <div class="steps three" id="stepsReceiver" hidden></div>
</section>

<section class="section wrap ticket-sec">
  <div class="ticket-copy" data-reveal>
    <span class="eyebrow" data-i18n="final"></span>
    <h2><span data-i18n="home.tkH2a"></span><span class="grad-text" data-i18n="home.tkH2b"></span></h2>
    <ul class="ticks">
      <li><span class="badge" aria-hidden="true">📸</span><div><b data-i18n="home.tick1"></b><span data-i18n="home.tick1d"></span></div></li>
      <li><span class="badge" aria-hidden="true">📅</span><div><b data-i18n="addCal"></b><span data-i18n="home.tick2d"></span></div></li>
      <li><span class="badge" aria-hidden="true">💌</span><div><b data-i18n="home.tick3"></b><span data-i18n="home.tick3d"></span></div></li>
    </ul>
  </div>
  <div class="ticket-host" id="homeTicket" data-reveal></div>
</section>

<section class="section wrap">
  <div class="cta-band glass glow-border" data-reveal>
    <div class="lottie cta-lottie" data-lottie="couple" data-loop="1"></div>
    <div>
      <h2><span data-i18n="home.ctaH2a"></span><span class="grad-text" data-i18n="home.ctaH2b"></span><span data-i18n="home.ctaH2c"></span></h2>
      <p data-i18n="home.ctaP"></p>
    </div>
    <a class="btn btn-lg magnetic" href="#/create" data-new data-i18n="home.ctaBtn"></a>
  </div>
</section>

<footer class="footer wrap">
  <nav><a href="#/" data-soon="foot.privacy" data-i18n="foot.privacy"></a><a href="#/" data-soon="foot.terms" data-i18n="foot.terms"></a><a href="#/" data-soon="foot.contact" data-i18n="foot.contact"></a></nav>
  <p data-i18n="foot.note"></p>
</footer>
</template>

<!-- ============================ G1-G7 · CREATE ============================ -->
<template id="tpl-create">
<section class="create wrap">
  <div class="stepper" id="stepper"></div>
  <div class="create-grid">
    <div class="panel glass glow-border">

      <div class="cstep" data-step="1">
        <span class="eyebrow" data-i18n="c1.eyebrow"></span>
        <h2 data-i18n="c1.h2"></h2>
        <p class="sub" data-i18n="c1.sub"></p>
        <div class="field" id="fFrom">
          <label for="nameFrom" data-i18n="c1.from"></label>
          <div class="input-wrap"><input id="nameFrom" type="text" maxlength="20" autocomplete="off" data-i18n-attr="placeholder:c1.fromPh" aria-required="true" aria-describedby="hFrom cFrom"><span class="count" id="cFrom">0/20</span></div>
          <p class="hint error" id="hFrom" aria-live="polite" hidden></p>
        </div>
        <div class="field" id="fTo">
          <label for="nameTo" data-i18n="c1.to"></label>
          <div class="input-wrap"><input id="nameTo" type="text" maxlength="20" autocomplete="off" data-i18n-attr="placeholder:c1.toPh" aria-required="true" aria-describedby="hTo cTo"><span class="count" id="cTo">0/20</span></div>
          <p class="hint error" id="hTo" aria-live="polite" hidden></p>
        </div>
        <div class="nav"><a class="btn btn-ghost" href="#/" data-i18n="c1.home"></a><button class="btn" id="next1" type="button" disabled data-i18n="next"></button></div>
      </div>

      <div class="cstep" data-step="2">
        <span class="eyebrow" data-i18n="c2.eyebrow"></span>
        <h2 data-i18n="c2.h2"></h2>
        <p class="sub" data-i18n="c2.sub"></p>
        <div class="section-label" data-i18n="c2.templates"></div>
        <div class="choices" id="templates"></div>
        <div class="field" id="fMsg">
          <label for="msg" data-i18n="c2.msg"></label>
          <div class="input-wrap"><textarea class="input" id="msg" maxlength="100" rows="3" aria-required="true" aria-describedby="hMsg cMsg"></textarea><span class="count bottom" id="cMsg">0/100</span></div>
          <p class="hint error" id="hMsg" aria-live="polite" hidden></p>
        </div>
        <div class="nav"><button class="btn btn-ghost" type="button" data-back data-i18n="back"></button><button class="btn" id="next2" type="button" disabled data-i18n="next"></button></div>
      </div>

      <div class="cstep" data-step="3">
        <span class="eyebrow" data-i18n="c3.eyebrow"></span>
        <h2 data-i18n="c3.h2"></h2>
        <p class="sub" data-i18n="c3.sub"></p>
        <div id="fixedPane">
          <div class="section-label" data-i18n="c3.date"></div>
          <div id="cal"></div>
          <div class="time-row">
            <div><div class="section-label" data-i18n="c3.hour"></div><div id="hours"></div></div>
            <div><div class="section-label" data-i18n="c3.min"></div><div id="mins"></div></div>
          </div>
          <p class="when-line" id="when"></p>
        </div>
        <div class="nav"><button class="btn btn-ghost" type="button" data-back data-i18n="back"></button><button class="btn" id="next3" type="button" disabled data-i18n="next"></button></div>
      </div>

      <div class="cstep" data-step="4">
        <span class="eyebrow" data-i18n="c4.eyebrow"></span>
        <h2 data-i18n="c4.h2"></h2>
        <p class="sub" data-i18n="c4.sub"></p>
        <div class="seg seg-plans" role="group" data-i18n-attr="aria-label:c4.type">
          <button class="seg-tab" type="button" aria-pressed="true" aria-controls="planList" data-ptab="an"><span data-i18n="group.an"></span> <span id="cntAn"></span></button>
          <button class="seg-tab" type="button" aria-pressed="false" aria-controls="planList" data-ptab="choi"><span data-i18n="group.choi"></span> <span id="cntChoi"></span></button>
        </div>
        <div class="opt-grid plan-scroll" id="planList"></div>
        <p class="counter" id="counter" aria-live="polite"></p>
        <div class="nav"><button class="btn btn-ghost" type="button" data-back data-i18n="back"></button><button class="btn" id="next4" type="button" disabled data-i18n="preview"></button></div>
      </div>

      <div class="cstep" data-step="5">
        <span class="eyebrow" data-i18n="preview"></span>
        <h2 data-i18n="c5.h2"></h2>
        <p class="sub" data-i18n="c5.sub"></p>
        <div class="preview-phone"><span class="phone-notch"></span><div class="preview-host" id="previewHost"></div></div>
        <div class="center"><button class="link" id="replay" type="button" data-i18n="c5.replay"></button></div>
        <div class="nav"><button class="btn btn-ghost" id="editBtn" type="button" data-i18n="c5.edit"></button><button class="btn" id="next5" type="button" data-i18n="createLink"></button></div>
      </div>

      <div class="cstep" data-step="6">
        <span class="eyebrow" data-i18n="c6.eyebrow"></span>
        <h2 data-i18n="c6.h2"></h2>
        <p class="sub" data-i18n="c6.sub"></p>
        <div class="choices" id="pricing"></div>
        <div class="checks">
          <label class="check"><input type="checkbox" id="age"> <span data-i18n="c6.age"></span></label>
          <label class="check"><input type="checkbox" id="terms"> <span><span data-i18n="c6.agree"></span><a href="#/create" data-soon="foot.terms" data-i18n="foot.terms"></a><span data-i18n="c6.and"></span><a href="#/create" data-soon="foot.policy" data-i18n="foot.policy"></a></span></label>
        </div>
        <p class="hint" id="hCreate" data-i18n="c6.hint"></p>
        <div class="nav"><button class="btn btn-ghost" type="button" data-back data-i18n="back"></button><button class="btn" id="createBtn" type="button" aria-describedby="hCreate" disabled data-i18n="createLink"></button></div>
      </div>

      <div class="cstep" data-step="7">
        <div class="launch">
          <span class="launch-emoji" aria-hidden="true">🎉</span>
          <span class="eyebrow" data-i18n="c7.eyebrow"></span>
          <h2 data-i18n="c7.h2"></h2>
          <p class="sub" data-i18n="c7.sub"></p>
        </div>
        <div class="linkbox"><span id="link"></span><button class="btn btn-ghost btn-sm" id="copyLink" type="button" data-i18n="copy"></button></div>
        <div class="field" id="fShare">
          <label for="shareMsg" data-i18n="c7.shareLabel"></label>
          <div class="input-wrap"><textarea class="input" id="shareMsg" maxlength="100" rows="2" aria-describedby="hShare cShare" data-i18n="c7.shareDefault"></textarea><span class="count bottom" id="cShare"></span></div>
          <p class="hint" id="hShare" aria-live="polite"></p>
        </div>
        <button class="btn btn-block btn-lg" id="shareBtn" type="button" data-i18n="c7.share"></button>
        <div class="fb glass-inner" id="fb">
          <p data-i18n="c7.fb"></p>
          <div class="chip-row" id="fbOpts"></div>
        </div>
        <div class="nav"><a class="btn btn-ghost" href="#/q" data-i18n="c7.manage"></a><button class="btn btn-ghost" id="newBtn" type="button" data-i18n="c7.new"></button></div>
      </div>

    </div>
  </div>
</section>
</template>

<!-- ============================ N1-N6 · RECEIVER ============================ -->
<template id="tpl-n">
<section class="recv wrap">
  <div class="recv-card glass glow-border">
    <div class="recv-progress"><i id="rProg"></i></div>

    <div class="rstep active" data-step="1">
      <div class="lottie lt-fill" data-lottie="hearts" data-loop="1" data-fit="slice"></div>
      <span class="eyebrow" id="loveEyebrow" data-i18n="letter.for"></span>
      <div class="love" id="love">
        <svg class="bloom" id="bloom" viewBox="-20 -20 440 400" aria-hidden="true"></svg>
        <p class="love-hint" id="loveHint" data-i18n="recv.hint"></p>
      </div>
      <div class="dash" id="dash" hidden>
        <span class="dash-skin" aria-hidden="true"></span>
        <div class="dash-top"><span class="dash-tag"><i></i><span data-i18n="recv.tag"></span></span><span class="dash-code" id="dCode"></span></div>
        <h2 class="dash-title"><span id="dTo"></span> <i aria-hidden="true">×</i> <span id="dFrom"></span></h2>
        <p class="dash-msg" id="dMsg"></p>
        <div class="dash-stats">
          <div class="stat wide when"><small data-i18n="recv.date"></small><b id="dWhen"></b></div>
          <div class="stat wide"><small data-i18n="recv.countdown"></small><b id="dLeft"></b></div>
        </div>
        <div class="dash-label"><span data-i18n="recv.itinerary"></span><span id="dCount"></span></div>
        <ol class="dash-tl" id="dPlans"></ol>
        <button class="btn btn-lg btn-block" id="dashGo" type="button" data-i18n="recv.reply"></button>
      </div>
    </div>

    <div class="rstep" data-step="2">
      <span class="eyebrow" data-i18n="recv.showing"></span>
      <div class="ask-emoji" aria-hidden="true">🥺</div>
      <h1 class="ask-title" id="askTitle"></h1>
      <p class="sub" data-i18n="recv.oneAnswer"></p>
      <div class="ask-buttons" id="askButtons">
        <button class="btn btn-lg" id="yesBtn" type="button">YES</button>
        <button class="btn btn-ghost btn-lg" id="noBtn" type="button" data-i18n="ask.no"></button>
      </div>
      <p class="runaway" id="runawayMsg" hidden data-i18n="ask.runaway"></p>
    </div>

    <div class="rstep" data-step="3">
      <div class="lottie end-lottie" data-lottie="holdHands" data-loop="1"></div>
      <span class="eyebrow" data-i18n="final"></span>
      <h2 data-i18n="recv.done"></h2>
      <p class="sub" id="endSub"></p>
      <div class="ticket-host" id="rTicket"></div>
      <button class="btn btn-block btn-lg" id="saveBtn" type="button" data-i18n="recv.save"></button>
      <div class="end-actions">
        <button class="btn btn-ghost" id="calBtn" type="button" data-i18n="addCal"></button>
        <button class="btn btn-ghost" id="mineBtn" type="button" data-i18n="makeYours"></button>
      </div>
    </div>
  </div>
</section>
</template>

<!-- ============================ N7 · GONE ============================ -->
<template id="tpl-gone">
<section class="recv wrap">
  <div class="recv-card glass glow-border gone">
    <div class="big-emoji" aria-hidden="true">🫥</div>
    <span class="eyebrow" data-i18n="gone.eyebrow"></span>
    <h2 data-i18n="gone.h2"></h2>
    <p class="sub" data-i18n="gone.sub"></p>
    <a class="btn btn-lg" href="#/" data-new data-i18n="makeYours"></a>
  </div>
</section>
</template>

<!-- ============================ Q · MANAGE ============================ -->
<template id="tpl-q">
<section class="manage wrap">
  <div class="q-head">
    <span class="eyebrow" data-i18n="q.eyebrow"></span>
    <h2 data-i18n="nav.mine"></h2>
    <p class="sub" data-i18n="q.sub"></p>
  </div>
  <div class="q-bar">
    <div class="seg" role="group" data-i18n-attr="aria-label:q.view">
      <span class="seg-ind" aria-hidden="true"></span>
      <button class="seg-tab" type="button" aria-pressed="true" aria-controls="paneList" data-tab="list" data-i18n="q.list"></button>
      <button class="seg-tab" type="button" aria-pressed="false" aria-controls="paneCal" data-tab="cal" data-i18n="q.cal"></button>
    </div>
    <button class="link" id="sampleBtn" type="button" data-i18n="q.sample"></button>
  </div>
  <div id="paneList">
    <div class="q-list" id="qList"></div>
    <div class="empty glass" id="qEmpty" hidden>
      <div class="big-emoji" aria-hidden="true">🎬</div>
      <b data-i18n="q.empty"></b>
      <p data-i18n="q.emptyP"></p>
    </div>
  </div>
  <div id="paneCal" hidden>
    <div class="glass q-cal-card"><div id="qCal"></div></div>
